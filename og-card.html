<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-card source (1200x630)</title>
<!--
  Source for og-image.png. Every value here comes from DESIGN.md; nothing is invented.
  Regenerate with system Chrome, no repo dependencies:

    chrome --headless --disable-gpu --hide-scrollbars --window-size=1200,630 \
           --virtual-time-budget=8000 --screenshot=og-image.png og-card.html

  Then confirm the output is exactly 1200x630 before committing it.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
:root{
  --paper:#F1F2EC;
  --ink:#212A20;
  --green:#35573C;
  --clay:#B4552B;
  --mist:#DFE2D5;
  --faint:#5C6659;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#ffffff}
.card{
  width:1200px;
  height:630px;
  background:var(--paper);
  color:var(--ink);
  padding:72px 76px 64px;
  display:flex;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* the statement, and the rail that answers it */
.mid{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:56px;
}
h1{
  font-family:"Bricolage Grotesque",sans-serif;
  font-weight:800;
  font-size:82px;
  line-height:1.02;
  letter-spacing:-.025em;
  width:756px;
}

/* signature element: the FIND / BUILD / STICK rail */
.rail{position:relative;list-style:none;padding-left:46px;width:236px}
.rail::before{
  content:"";
  position:absolute;
  left:9px;top:11px;bottom:11px;
  width:2px;
  background:var(--mist);
}
.rail li{display:flex;align-items:center;height:22px}
.rail li + li{margin-top:94px}
.node{
  position:absolute;left:0;
  width:22px;height:22px;
  border-radius:50%;
  background:var(--paper);
  border:3px solid var(--green);
}
.rail li.stick .node{border-color:var(--clay)}
.lbl{
  font-family:"IBM Plex Mono",monospace;
  font-weight:500;
  font-size:23px;
  letter-spacing:.14em;
  text-transform:uppercase;
  white-space:nowrap;
  color:var(--ink);
}
.lbl i{font-style:normal;color:var(--faint)}

/* signature bar */
.bot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:32px;
  border-top:1px solid var(--mist);
  padding-top:26px;
}
.mark{display:flex;align-items:center;gap:15px}
.mark svg{display:block}
.mark span{
  font-family:"Bricolage Grotesque",sans-serif;
  font-weight:700;
  font-size:30px;
  letter-spacing:-.01em;
}
.who{
  font-family:"IBM Plex Mono",monospace;
  font-size:17px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--faint);
}
</style>
</head>
<body>

<div class="card">

  <div class="mid">
    <h1>Companies have AI now and little to show for it.</h1>
    <ol class="rail">
      <li><span class="node"></span><span class="lbl"><i>01 &middot;</i> Find</span></li>
      <li><span class="node"></span><span class="lbl"><i>02 &middot;</i> Build</span></li>
      <li class="stick"><span class="node"></span><span class="lbl"><i>03 &middot;</i> Stick</span></li>
    </ol>
  </div>

  <div class="bot">
    <div class="mark">
      <svg width="42" height="42" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#35573C"/><circle cx="16" cy="8" r="2.6" fill="#F1F2EC"/><circle cx="16" cy="16" r="2.6" fill="#F1F2EC"/><circle cx="16" cy="24" r="2.6" fill="#B4552B"/><path d="M16 10.6v2.8m0 5.2v2.8" stroke="#F1F2EC" stroke-width="1.4"/></svg>
      <span>Ben Kanspedos</span>
    </div>
    <span class="who">Applied AI consulting &middot; Essential Concepts LLC</span>
  </div>

</div>

</body>
</html>
